version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: renttrail-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    container_name: renttrail-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - mongo

  client:
    build: ./client
    container_name: renttrail-client
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo-data:
